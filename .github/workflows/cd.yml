name: CD

# CI muvaffaqiyatli tugaganda ishlaydi (main -> production, dev -> development).
# Stages: build (image + build info tekshiruvi + Trivy + Docker Hub push) -> prepare (pull)
#         -> deploy (run + health check + commit tekshiruvi, xato bo'lsa eski image'ga rollback) -> notify
# Environment'lar: production (main) va development (dev). Har birida:
#   SERVER_HOST, SERVER_USER, DOCKERHUB_USERNAME, IMAGE_NAME, CONTAINER_NAME,
#   SSH_PRIVATE_KEY, DOCKERHUB_TOKEN, VITE_API_URL (build-arg)
# Build info: VERSION va COMMIT build-arg sifatida image'ga kiradi (LABEL + /version.json).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && 'production' || github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && 'production' || 'development' }}
    env:
      DEPLOY_ENV: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || github.event.workflow_run.head_branch == 'dev' && 'development' || github.ref_name == 'main' && 'production' || 'development' }}
      SERVER_HOST: ${{ vars.SERVER_HOST }}
      SERVER_USER: ${{ vars.SERVER_USER }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      CONTAINER: ${{ vars.CONTAINER_NAME }}
    steps:
      # Tag = qisqa commit sha (7 belgi), masalan 10449/zahrodent_admin:8d777fa
      - name: Set image
        run: |
          echo "IMAGE=$IMAGE_NAME:${SHA::7}" >> "$GITHUB_ENV"
          echo "COMMIT=${SHA::7}" >> "$GITHUB_ENV"

      - name: Check variables
        run: |
          missing=""
          for k in SERVER_HOST SERVER_USER CONTAINER; do [ -z "${!k}" ] && missing="$missing $k"; done
          [ -z "$IMAGE_NAME" ] && missing="$missing IMAGE_NAME"
          if [ -n "$missing" ]; then echo "::error::$DEPLOY_ENV environment'da yo'q:$missing"; exit 1; fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # git describe tag'larni ko'rishi uchun to'liq tarix kerak
          fetch-depth: 0

      - name: Set build info
        run: echo "VERSION=$(git describe --tags --always "$SHA")" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_TELEGRAM_BOT_USERNAME=${{ vars.VITE_TELEGRAM_BOT_USERNAME }}
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Noto'g'ri metadata'li image push qilinmasin.
      - name: Verify build info
        run: |
          got=$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          echo "Image commit label: $got (kutilgan: $COMMIT)"
          if [ "$got" != "$COMMIT" ]; then
            echo "::error::Image ichidagi commit ($got) kutilgan commit ($COMMIT) bilan mos emas"
            exit 1
          fi

      # Fix'i bor CRITICAL zaiflik bo'lsa to'xtaydi; HIGH va fix'siz — faqat log.
      - name: Trivy scan
        run: |
          trivy() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              aquasec/trivy:0.75.0 "$@"
          }
          trivy image --scanners vuln --no-progress --severity HIGH,CRITICAL --exit-code 0 "$IMAGE"
          trivy image --scanners vuln --no-progress --skip-db-update --ignore-unfixed \
            --severity CRITICAL --exit-code 1 "$IMAGE"

      - name: Docker push
        run: |
          LATEST="${IMAGE%:*}:latest"
          docker tag "$IMAGE" "$LATEST"
          docker push "$IMAGE"
          docker push "$LATEST"

  prepare:
    name: Prepare
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && 'production' || github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && 'production' || 'development' }}
    env:
      DEPLOY_ENV: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || github.event.workflow_run.head_branch == 'dev' && 'development' || github.ref_name == 'main' && 'production' || 'development' }}
      SERVER_HOST: ${{ vars.SERVER_HOST }}
      SERVER_USER: ${{ vars.SERVER_USER }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      CONTAINER: ${{ vars.CONTAINER_NAME }}
    steps:
      # Tag = qisqa commit sha (7 belgi), masalan 10449/zahrodent_admin:8d777fa
      - name: Set image
        run: echo "IMAGE=$IMAGE_NAME:${SHA::7}" >> "$GITHUB_ENV"

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host server\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id\n' "$SERVER_HOST" "$SERVER_USER" > ~/.ssh/config

      - name: Docker pull
        run: |
          # shellcheck disable=SC2029 # IMAGE runner'da ochiladi (ataylab)
          ssh server "docker pull '$IMAGE'"


  deploy:
    name: Deploy
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    environment:
      name: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && 'production' || github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && 'production' || 'development' }}

    env:
      DEPLOY_ENV: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || github.event.workflow_run.head_branch == 'dev' && 'development' || github.ref_name == 'main' && 'production' || 'development' }}
      SERVER_HOST: ${{ vars.SERVER_HOST }}
      SERVER_USER: ${{ vars.SERVER_USER }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      CONTAINER: ${{ vars.CONTAINER_NAME }}
      HOST_PORT: ${{ vars.HOST_PORT }}
      
    steps:
      # Image va commit
      - name: Set image
        run: |
          echo "IMAGE=$IMAGE_NAME:${SHA::7}" >> "$GITHUB_ENV"
          echo "COMMIT=${SHA::7}" >> "$GITHUB_ENV"

      # Variables tekshirish
      - name: Check variables
        run: |
          missing=""

          for k in SERVER_HOST SERVER_USER CONTAINER HOST_PORT IMAGE_NAME; do
            [ -z "${!k}" ] && missing="$missing $k"
          done

          if [ -n "$missing" ]; then
            echo "::error::$DEPLOY_ENV environment'da yo'q:$missing"
            exit 1
          fi

          if ! [[ "$HOST_PORT" =~ ^[0-9]+$ ]] || \
             [ "$HOST_PORT" -lt 1 ] || [ "$HOST_PORT" -gt 65535 ]; then
            echo "::error::HOST_PORT noto'g'ri: $HOST_PORT"
            exit 1
          fi

          echo "Deploy environment: $DEPLOY_ENV"
          echo "Container: $CONTAINER"
          echo "Host port: $HOST_PORT"

      # SSH
      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id
          chmod 600 ~/.ssh/id

          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          printf 'Host server\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id\n' \
            "$SERVER_HOST" "$SERVER_USER" > ~/.ssh/config

      # Deploy + Health check + Version check + Rollback
      - name: Deploy
        run: |
          # shellcheck disable=SC2029
          ssh server "IMAGE='$IMAGE' CONTAINER='$CONTAINER' COMMIT='$COMMIT' HOST_PORT='$HOST_PORT' bash -s" << 'EOF'
            set -u

            echo "================================"
            echo "Environment deploy"
            echo "Image: $IMAGE"
            echo "Container: $CONTAINER"
            echo "Port: $HOST_PORT"
            echo "Commit: $COMMIT"
            echo "================================"

            # Port validation
            if ! [[ "$HOST_PORT" =~ ^[0-9]+$ ]] || \
               [ "$HOST_PORT" -lt 1 ] || [ "$HOST_PORT" -gt 65535 ]; then
              echo "❌ Invalid HOST_PORT"
              exit 1
            fi

            # Oldingi image
            PREV=$(docker inspect -f '{{.Config.Image}}' "$CONTAINER" 2>/dev/null || true)

            echo "Oldingi image: ${PREV:-none}"

            # Container ishga tushirish
            run() {
              local image="$1"

              docker rm -f "$CONTAINER" >/dev/null 2>&1 || true

              docker run -d \
                --name "$CONTAINER" \
                --restart unless-stopped \
                -p "127.0.0.1:${HOST_PORT}:80" \
                "$image" >/dev/null
            }

            # Health check
            healthy() {
              for _ in $(seq 1 30); do
                if curl -fsS \
                  "http://127.0.0.1:${HOST_PORT}/healthz" \
                  >/dev/null 2>&1; then
                  return 0
                fi

                sleep 3
              done

              return 1
            }

            # Commit check
            version_ok() {
              curl -fsS \
                "http://127.0.0.1:${HOST_PORT}/version.json" \
                2>/dev/null |
                grep -q "\"commit\":\"$COMMIT\""
            }

            # New deployment
            echo "🚀 Starting deployment..."

            if run "$IMAGE" && healthy && version_ok; then
              echo "================================"
              echo "✅ DEPLOY SUCCESSFUL"
              echo "Image: $IMAGE"
              echo "Commit: $COMMIT"
              echo "Port: $HOST_PORT"
              echo "================================"
              exit 0
            fi

            echo "❌ Health/version/deploy failed"

            # Diagnostics
            echo "Version response:"
            curl -sS \
              "http://127.0.0.1:${HOST_PORT}/version.json" || true

            echo ""
            echo "Container logs:"
            docker logs --tail 100 "$CONTAINER" 2>&1 || true

            # Rollback
            if [ -n "$PREV" ]; then
              echo "================================"
              echo "↩️ ROLLBACK STARTED"
              echo "Previous image: $PREV"
              echo "================================"

              if run "$PREV" && healthy; then
                echo "✅ Rollback successful"
                echo "Restored image: $PREV"
              else
                echo "❌ ROLLBACK FAILED"
                docker logs --tail 100 "$CONTAINER" 2>&1 || true
              fi
            else
              echo "⚠️ Previous image not found"
            fi

            exit 1
          EOF
          
      # Docker image cleanup
      - name: Cleanup
        if: always()
        run: |
          ssh server \
            'docker image prune -af --filter "until=168h" >/dev/null || true'

  notify:
    name: Notify
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && 'production' || github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && 'production' || 'development' }}
    needs: [build, prepare, deploy]
    if: always() && needs.build.result != 'skipped'
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      # Every value goes through env, never ${{ }} inside run: (script injection).
      - name: Send Telegram message
        env:
          BOT_TOKEN: ${{ secrets.PR_TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.PR_DEV_GROUP_ID }}
          TOPIC_ID: ${{ vars.PR_TOPIC_ID }}
          WORKFLOW: CD
          BUILD: ${{ needs.build.result }}
          PREPARE: ${{ needs.prepare.result }}
          DEPLOY: ${{ needs.deploy.result }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          ACTOR: ${{ github.event.workflow_run.actor.login || github.actor }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message || 'manual deploy' }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha || github.sha }}
        run: bash .github/script/notify-telegram.sh