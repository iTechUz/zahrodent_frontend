# Har bir add_header ishlatadigan location ichida include qilinadi
# (nginx location o'zi add_header bersa server darajasidagilarni MEROS QILMAYDI).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# CSP: skriptlar faqat o'z origin'idan. style-src 'unsafe-inline' — framer-motion/tailwind inline style'lari uchun.
# connect-src: API origin'i build vaqtida belgilanadi, shuning uchun hozircha har qanday https:ga ruxsat
# (keyinchalik aniq API origin'iga toraytirish mumkin). frame-src: Google Maps embed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; frame-src https://www.google.com https://maps.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
